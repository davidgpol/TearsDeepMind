services:
  tears-db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    container_name: tears-db
    environment:
      POSTGRES_DB: tearsmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tearsmind_pwd
    ports:
      - "5432:5432"
    volumes:
      - ../../Volumes/TearsMindDB:/var/lib/postgresql/data:Z
    networks:
      - tears-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-backup:
    image: prodrigestivill/postgres-backup-local
    restart: always
    volumes:
      - ../../Volumes/TearsMindBackups:/backups
    depends_on:
      tears-db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=tears-db
      - POSTGRES_DB=tearsmind
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=tearsmind_pwd
      - POSTGRES_EXTRA_OPTS=-Z9 --schema=public --blobs
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    networks:
      - tears-net

  tears-selenium:
    image: seleniarm/standalone-chromium:latest
    container_name: tears-selenium
    shm_size: 2gb
    networks:
      - tears-net
    ports:
      - "4444:4444"

  tears-app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: tears-app
    depends_on:
      tears-db:
        condition: service_healthy
      tears-selenium:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://tears-db:5432/tearsmind
      DB_USER: postgres
      DB_PASSWORD: tearsmind_pwd
      CRAWLER_EMAIL: ${CRAWLER_EMAIL:-davidgapol@gmail.com}
      CRAWLER_PASSWORD: ${CRAWLER_PASSWORD:-%Mo&5ag8c*42VpfEkAie}
      SELENIUM_REMOTE_URL: http://tears-selenium:4444/wd/hub
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_TO: ${EMAIL_TO}
    volumes:
      - ../../Volumes/TearsMind:/app/TearsMind:Z
      - ../AgentsRepository:/app/AgentsRepository:Z
    ports:
      - "8080:8080"
    networks:
      - tears-net

networks:
  tears-net:
    driver: bridge