# Crawler Configuration
crawler.email=${CRAWLER_EMAIL}
crawler.password=${CRAWLER_PASSWORD}
crawler.headless=true

# Spring Configuration
spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=300000
logging.level.com.tearsdeepmind=INFO

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tearsmind}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.schemas=public,crawler,analysis,notification,ingestion,market_data
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=true

# Gemini Models Configuration (Priority Order)
gemini.models[0].name=gemini-3-pro-preview
gemini.models[0].url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3-pro-preview:generateContent
gemini.models[0].key=${GEMINI_API_KEY}

gemini.models[1].name=gemini-3-flash-preview
gemini.models[1].url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent
gemini.models[1].key=${GEMINI_API_KEY}

gemini.models[2].name=gemini-2.5-pro
gemini.models[2].url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent
gemini.models[2].key=${GEMINI_API_KEY}

gemini.models[3].name=gemini-2.5-flash
gemini.models[3].url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.models[3].key=${GEMINI_API_KEY}

gemini.models[4].name=gemini-2.0-flash
gemini.models[4].url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
gemini.models[4].key=${GEMINI_API_KEY}

# Mail Notifications Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

tears.notifications.from=${SMTP_USER}