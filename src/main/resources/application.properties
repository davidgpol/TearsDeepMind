# Crawler Configuration
# Credentials are injected via environment variables or system properties (12-Factor App)
# Last Security Update: 2025-12-29
crawler.email=${CRAWLER_EMAIL}
crawler.password=${CRAWLER_PASSWORD}
crawler.headless=true

# Spring Configuration
spring.mvc.async.request-timeout=300000
logging.level.com.tearsdeepmind=INFO

# Database Configuration (SQLite)
spring.datasource.url=jdbc:sqlite:data/tearsmind.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.sqlite.hibernate.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false