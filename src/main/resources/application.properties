# Crawler Configuration
# Credentials are injected via environment variables or system properties (12-Factor App)
# Last Security Update: 2025-12-29
crawler.email=${CRAWLER_EMAIL}
crawler.password=${CRAWLER_PASSWORD}
crawler.headless=true

# Spring Configuration
spring.mvc.async.request-timeout=300000
logging.level.com.tearsdeepmind=INFO

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tearsmind}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.schemas=public,crawler,analysis
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1