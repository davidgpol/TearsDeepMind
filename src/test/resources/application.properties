# Test Database (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:tearsmind;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway Configuration for Tests
spring.flyway.enabled=true
spring.flyway.schemas=public,crawler,analysis,notification,ingestion,market_data
spring.flyway.locations=classpath:db/migration

# Dummy Crawler Credentials for Tests
crawler.email=test@example.com
crawler.password=testpass

# Dummy Mail Configuration
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
