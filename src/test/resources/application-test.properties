spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Disable OpenAI autoconfiguration for tests if possible or provide dummy key
spring.ai.openai.api-key=test-key
tears.notifications.from=test@tearsdeepmind.com

# Gemini Test Config
gemini.models[0].name=gemini-test
gemini.models[0].url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
gemini.models[0].key=${GEMINI_API_KEY}
